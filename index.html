<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parkinson Disease Detection</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #eef2ff, #f8fafc);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            background: white;
            padding: 30px;
            width: 650px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
        }

        h2 {
            margin-bottom: 10px;
        }

        textarea {
            width: 100%;
            height: 130px;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #ddd;
            margin-top: 10px;
            font-size: 14px;
        }

        button {
            width: 100%;
            margin-top: 15px;
            padding: 12px;
            border: none;
            background: #2563eb;
            color: white;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background: #1e40af;
        }

        #result {
            margin-top: 20px;
            font-size: 20px;
            font-weight: bold;
        }

        .helper {
            font-size: 13px;
            color: #666;
            margin-top: 8px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h2>Parkinson Disease Prediction</h2>

        <div class="helper">
            Enter 22 comma-separated values
        </div>

        <textarea id="inputData" placeholder="119.992,157.302,74.997,0.00784,0.00007,..."></textarea>

        <button onclick="predict()">Predict</button>

        <div id="result"></div>

    </div>

    <script>
        async function predict() {

            let input = document.getElementById("inputData").value.trim()

            let values = input.split(",")

            values = values.map(v => parseFloat(v))

            const response = await fetch("/predict", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    data: values
                })
            })

            const result = await response.json()

            document.getElementById("result").innerHTML =
                "Prediction: " + result.prediction

        }
    </script>
</body>

</html>
